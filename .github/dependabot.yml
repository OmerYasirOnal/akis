# Dependabot — automated dependency-update PRs (the audit gap: the repo had a frozen
# lockfile + --frozen-lockfile CI but no vulnerability-update mechanism). Weekly, grouped
# so a burst of minor/patch bumps arrives as one reviewable PR rather than dozens.
version: 2
updates:
  # The pnpm workspace (root manifest drives all three packages).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Non-breaking bumps batched into a single PR to keep review load sane.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # vitest and its plugins share a lockstep peer range — split major PRs can
      # NEVER go green individually (observed: #176 + #177 both failed alone).
      vitest-major:
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - major
    ignore:
      # @types/node must track the RUNTIME Node major (22, pinned in ci.yml and
      # the Dockerfile) — a types-only major bump lies about the platform API
      # surface (observed: #179 red). Minors within 22.x still arrive.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

  # The GitHub Actions used by the CI / release workflows (pinned action versions rot too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all action bumps: validate-p2-artifacts.sh literal-pins three of
      # them, so a bump only goes green when the script moves in the same PR — a
      # single grouped PR is easy to take over and pair with that one-line edit
      # (solo bumps #172/#174 could never pass on their own).
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
